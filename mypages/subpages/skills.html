<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: #a0a0a0;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }
    .skills-grid {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .skill-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      min-width: 220px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .skill-card:hover {
      transform: translateY(-8px);
      background: rgba(255,255,255,0.1);
      border-color: #e94560;
      box-shadow: 0 20px 40px rgba(233,69,96,0.2);
    }
    .skill-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .skill-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .skill-desc {
      font-size: 0.9rem;
      color: #a0a0a0;
      line-height: 1.5;
    }
    footer {
      margin-top: 3rem;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>技能集</h1>
    <p class="subtitle">点击卡片查看详细技能文档</p>

    <div class="skills-grid">
      <a href="skill_docs/cuda-programming.md" class="skill-card">
        <div class="skill-icon">🚀</div>
        <div class="skill-title">CUDA 编程</div>
        <div class="skill-desc">GPU 并行计算、内核优化与内存管理</div>
      </a>

      <a href="skill_docs/ai-agent-dev.md" class="skill-card">
        <div class="skill-icon">🤖</div>
        <div class="skill-title">AI Agent 开发</div>
        <div class="skill-desc">智能体架构、工具调用与自主决策</div>
      </a>

      <a href="skill_docs/web-frontend.md" class="skill-card">
        <div class="skill-icon">🎨</div>
        <div class="skill-title">Web 前端</div>
        <div class="skill-desc">现代 CSS、响应式布局与交互设计</div>
      </a>
    </div>

    <footer>本地技能文档中心 · 点击任意卡片开始阅读</footer>
  </div>
</body>
</html>
