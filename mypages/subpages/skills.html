<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能集 - AI Knowledge Hub</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .subpage-header { padding: 4rem 2rem 2rem; text-align: center; position: relative; z-index: 1; }
    .subpage-header h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; margin-bottom: 1rem; }
    .subpage-header h1 span { background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subpage-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

    .article-list { max-width: 900px; margin: 0 auto; padding: 0 2rem 4rem; position: relative; z-index: 1; }
    .article-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.3s;
      cursor: pointer;
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.5s ease-out backwards;
    }
    .article-item:hover {
      transform: translateX(8px);
      border-color: var(--primary-light);
      box-shadow: var(--shadow);
    }
    .article-num {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--gradient-1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
      flex-shrink: 0;
    }
    .article-content h4 { font-size: 1.1rem; margin-bottom: 0.3rem; font-weight: 700; }
    .article-content p { color: var(--text-muted); font-size: 0.9rem; }

    .add-article {
      border: 2px dashed var(--border);
      background: transparent;
      justify-content: center;
      color: var(--text-muted);
    }
    .add-article:hover {
      border-color: var(--primary-light);
      color: var(--text);
      background: rgba(99, 102, 241, 0.05);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      margin: 2rem;
      position: relative;
      z-index: 1;
    }
    .back-btn:hover {
      background: var(--gradient-1);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .subpage-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      margin: 0.25rem;
    }

    .sub-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 1rem 2rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="particles"></div>

  <header>
    <nav>
      <div class="logo">
        <div class="logo-icon">🧠</div>
        AI Knowledge Hub
      </div>
      <ul class="nav-links">
        <li><a href="../index.html">🏠 首页</a></li>
        <li><a href="../index.html#topics">📚 知识库</a></li>
        <li><a href="#" class="active">🔗 技能集</a></li>
      </ul>
    </nav>
  </header>

  <a href="../index.html" class="back-btn">← 返回首页</a>

  <section class="subpage-header">
    <h1>🔗 <span>技能集</span></h1>
    <p>技能增强与生态实践</p>
    <div class="sub-nav" style="margin-top: 1.5rem;">
      <span class="subpage-badge">📄 3 篇文章</span>
    </div>
  </section>

  <section class="article-list">
    <div class="article-item" onclick="editArticle(1)">
      <div class="article-num">1</div>
      <div class="article-content">
        <h4>技能增强</h4>
        <p>Skills的定义</p>
      </div>
    </div>

    <div class="article-item" onclick="editArticle(2)">
      <div class="article-num">2</div>
      <div class="article-content">
        <h4>生态工具盘点</h4>
        <p>官方工具集、社区贡献与最佳实践</p>
      </div>
    </div>
    <div class="article-item" onclick="editArticle(3)">
      <div class="article-num">3</div>
      <div class="article-content">
        <h4>与 MCP 及 Function Calling 对比</h4>
        <p>标准差异、适用场景与迁移指南</p>
      </div>
    </div>
  </section>

  <footer>
    <p>🧠 AI Knowledge Hub — Skill 技能 专题</p>
    <p style="margin-top: 0.5rem; font-size: 0.85rem;">使用此模板可自由扩展更多子话题与文章</p>
  </footer>

  <script src="../script.js"></script>
  <script>
    // 子页面独立功能
    function editArticle(id) {
      const titles = ['技能规范', '生态工具盘点', '与 MCP 及 Function Calling 对比'];
      const newTitle = prompt('编辑文章标题：', titles[id-1]);
      if (newTitle && newTitle !== titles[id-1]) {
        alert('✅ 文章已更新为：' + newTitle + '（实际项目需连接后端保存）');
      }
    }

  </script>
</body>
</html>
